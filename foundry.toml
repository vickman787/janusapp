[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
verbosity = 2

[profile.monad]
# Mirror Monad Testnet EVM config (EVM-compatible, no precompile differences)
evm_version = "paris"
gas_limit = 30000000

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 256 }

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

[etherscan]
# Monad Testnet doesn't have Etherscan; placeholder for future explorer
monad = { key = "placeholder", url = "https://testnet.monadexplorer.com/api" }
